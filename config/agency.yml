# ============================================================
# 代理店コードの「共通の仕組み」設定 — 実サイト (littlefamily-ssi)
#
#   代理店ごとの期待結果は config/agencies.yml で管理する
#   (config/agency-master.tsv + config/agency-profiles.yml から生成)。
#
#   [未実測] と書かれた項目は実サイトで確認できていない。
#   `npm run discover` の結果に合わせて設定すること。
#   未実測のまま実行しても誤検知は出ないが、その項目は検査されない。
# ============================================================

# URL パラメータ名 (確認済み)
paramName: insAgentNo

# 代理店名・あんしんパックの検査に使う文言 (確認済み)。
#   {company} は代理店マスタの会社名に置き換わる。
#   サイトの文言が変わったらここだけ直せばよい。
agencyNameTexts:
  header: "{company}"
  footer: "募集代理店：{company}"
  # 代理店名が出ないはずの場合 (自社コード・無効コード・コードなし)
  forbiddenWhenHidden: 募集代理店
  # 代理店名を読み取る場所。上から順に最初に見つかった要素を使う。
  #   見つからない場合はページ全体から探す (判定は甘くなる)。
  headerSelectors: ["header", "[role=banner]", ".header", "#header", ".l-header", ".p-header", ".site-header"]
  footerSelectors: ["footer", "[role=contentinfo]", ".footer", "#footer", ".l-footer", ".p-footer", ".site-footer"]
  # 「あんしんパック」の表記ゆれ (どれか 1 つでもあれば「表示あり」)
  anshinPack:
    - あんしんパック
    - 安心パック
  # 判定から除外する表記。
  #   「安心パックなし」は保険料の前提条件として注釈に出るもので、
  #   商品の案内ではない。これを「表示あり」と数えると、
  #   みらやく掲載不可の代理店が毎回 Critical になる (実サイトで発生)。
  #   除外したことは結果に併記するので、黙って無視はしない。
  anshinPackIgnore:
    - あんしんパックなし
    - 安心パックなし
    - あんしんパック無し
    - 安心パック無し

storage:
  # cookie | localStorage | both | none
  #   [未実測] 代理店コードの保存先が未確認のため none にしている。
  #   none の間は保存値を根拠にした判定を行わない
  #   (URL のみで引き回す実装を誤検知しないため)。
  #   discover で Cookie 名 / localStorage キーが判明したら設定する。
  type: none
  key: insAgentNo

# 全代理店に共通する判定要素 (既定で data-testid として解決される)。
# "css=" / "text=" を先頭に付けると任意のセレクタも使用できる。
#   [未実測] 実サイトの目印が未確認。
#   一致する要素が無い間、これらを使う検査は「検出なし」となる
#   (誤検知はしないが、検査もされない)。
selectors:
  agencyName: agency-name
  agencyPhone: agency-phone
  agencyBanner: agency-banner
  agencyLogo: agency-logo
  fallbackNotice: fallback-notice
  # 申込ボタン (確認済み: 「今すぐ申込む」)。
  #   text= は部分一致・大文字小文字を区別しない。
  #   文言が変わった場合はここを直せば全代理店の検査に反映される。
  ctaPrimary: "text=今すぐ申込"

application:
  # 申込サイトの URL は environments.yml (= .env の STAGING_APPLICATION_BASE_URL /
  # PRODUCTION_APPLICATION_BASE_URL) で環境ごとに設定する。
  #
  # [未実測] 引き継ぎ方式 (クエリ / Cookie / サーバーセッション / JavaScript) が未確認。
  #   agencies.yml の application は null のままなので、合否判定は行わない。
  #   代わりに tests/agency/agency-cta.spec.ts が
  #   「申込サイトへの導線があるか」「リンクにコードが乗るか」を実測して記録する。
  #   方式が確定したら agency-profiles.yml の application を設定する。
  sessionApiPattern: "**/api/session*"
  # 絶対に発生させてはならないリクエスト (申込完了・データ送信)。
  #   [要確認] 実サイトの申込完了 URL に合わせて必ず設定すること。
  #   本番で押してはならない操作を止める安全装置なので、
  #   申込導線の検査を有効にする前に実物に合わせる。
  forbiddenRequestPatterns:
    - "**/entry/complete*"
    - "**/api/application/submit*"
    # 申込完了 URL が未確認のため、明らかに完了を意味するパスも予防的に遮断する
    - "**/apply/complete*"
    - "**/application/complete*"
  forbiddenTestIds:
    - application-submit

# 代理店表示の「描画完了」の判定方法。
#   [未実測] type: none = 待たない (load 完了のみ)。
#   代理店情報がクライアント側で描画されるサイトでは、
#   その要素を selector に設定すると待ち時間の無駄がなくなる。
readyIndicator:
  type: none
  attribute: null
  value: null
  selector: null
  timeoutMs: 5000

# ページ遷移後のコード保持を検証する遷移パス (pages.yml の id)
persistenceFlow:
  - lp-service
  - lp-service-premium
