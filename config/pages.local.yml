# ============================================================
# テスト対象ページ
#   source: config  … 下記 pages の定義を使用する (初期方式)
#   source: sitemap … sitemap.xml から自動取得する (utils/page-source.ts)
# ============================================================
source: config

sitemap:
  path: /sitemap.xml
  # 取得件数の上限 (過剰なリクエスト防止)
  maxPages: 50
  includePatterns: []
  excludePatterns:
    - "**/preview/**"
    - "**/*.pdf"
  # sitemap から取得したページに適用する既定のチェック内容
  defaults:
    agencyAware: false
    checks: [layout, errors, links, visual, text]

pages:
  - id: lp
    name: 共通LP
    path: /lp/
    agencyAware: true          # 代理店コードによる表示差分があるページ
    checks: [layout, errors, links, visual, text]
    # 必ず存在すべき要素 (data-testid)
    requiredTestIds: [default-hero, common-benefits]
    # 重なり・はみ出しを検査する主要要素
    primaryTestIds: [site-header, default-hero, common-benefits, site-footer]

  - id: product
    name: 商品詳細
    path: /product.html
    agencyAware: true
    checks: [layout, errors, links, visual, text]
    requiredTestIds: [product-detail]
    primaryTestIds: [site-header, product-detail, site-footer]

  - id: price
    name: 保険料ページ
    path: /price.html
    agencyAware: true
    checks: [layout, errors, links, visual, text]
    requiredTestIds: [price-table]
    primaryTestIds: [site-header, price-table, site-footer]

  - id: faq
    name: FAQ
    path: /faq.html
    agencyAware: false
    checks: [layout, errors, links, visual, text]
    requiredTestIds: [faq-list]
    primaryTestIds: [site-header, faq-list, site-footer]

  # 代理店専用 LP (リダイレクト先)。直接アクセスした場合の表示も検査する。
  - id: partner-a002
    name: 代理店専用LP (A002)
    path: /partner/a002/
    agencyAware: true
    checks: [layout, errors, links, visual, text]
    requiredTestIds: [partner-exclusive-hero, partner-exclusive-offer]
    primaryTestIds: [site-header, partner-exclusive-hero, site-footer]

  - id: partner-a003
    name: 代理店専用LP (A003)
    path: /partner/a003/
    agencyAware: true
    checks: [layout, errors, links, visual, text]
    requiredTestIds: [partner-exclusive-hero, partner-exclusive-offer]
    primaryTestIds: [site-header, partner-exclusive-hero, site-footer]

  # A004 の専用 LP。流入の入口であり、再訪時のリダイレクト先でもある
  - id: partner-a004
    name: 代理店専用LP (A004)
    path: /partner/a004/
    agencyAware: true
    checks: [layout, errors, links, text]
    requiredTestIds: [partner-exclusive-hero, partner-exclusive-offer]
    primaryTestIds: [site-header, partner-exclusive-hero, site-footer]

  - id: agency-only
    name: 代理店専用表示ページ
    path: /agency.html
    agencyAware: true
    checks: [layout, errors, links, visual, text]
    # agency-only-content は代理店コードがある場合のみ表示されるため、
    # 常に表示される要素を必須要素として指定する (表示・非表示は @agency で検証する)
    requiredTestIds: [agency-program]
    primaryTestIds: [site-header, agency-program, site-footer]
