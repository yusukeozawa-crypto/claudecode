# ============================================================
# 検査対象ページ — 実サイト (littlefamily-ssi LP ドメイン)
#
#   ここに載せるのは baseUrl (LP ドメイン) 配下のパスのみ。
#   コーポレートサイト (www.littlefamily-ssi.com) は別ホストなので
#   このファイルには入れられない。検査したい場合は
#   config/environments.yml に別環境として追加する
#   (docs/operations.md「別ホストを検査する」)。
#
#   source: config  … 下記の pages を検査する
#   source: sitemap … sitemap.xml から取得する (取得失敗時は pages にフォールバック)
# ============================================================
source: config

sitemap:
  path: /sitemap.xml
  maxPages: 50
  includePatterns: []
  excludePatterns:
    - "**/wp-admin/**"
  defaults:
    agencyAware: true
    checks: [layout, links, images, errors, text]

pages:
  - id: lp-service
    name: 共通LP (service)
    path: /lp/service/
    # 代理店コードによって表示が変わるページ
    agencyAware: true
    checks: [layout, links, images, errors, visual, text]

  - id: lp-service-premium
    name: 価格コム限定プラン専用LP (service-premium)
    path: /lp/service-premium/
    agencyAware: true
    checks: [layout, links, images, errors, visual, text]
