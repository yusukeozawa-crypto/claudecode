# ============================================================
# 代理店コードの「共通の仕組み」設定
#
#   代理店ごとの期待結果 (LP・リダイレクト・表示内容・申込引き継ぎ) は
#   config/agencies.yml で管理する。このファイルは全代理店に共通する
#   仕組み (パラメータ名・保存先・共通セレクタ) のみを扱う。
# ============================================================

# URL パラメータ名
paramName: agency_code

# 代理店名・あんしんパックの検査に使う文言 (実サイトと同じ形)
agencyNameTexts:
  header: "{company}"
  footer: "募集代理店：{company}"
  forbiddenWhenHidden: 募集代理店
  # フッターの要素。ここに入っているものをフッター表記、
  #   それ以外 (フッターの外) をヘッダー表記として扱う。
  #
  #   ヘッダー側はセレクタで指定しない。実サイトのヘッダーは
  #   Tailwind のユーティリティクラスだけで組まれており
  #   (hidden border-b md:block …)、見た目を変えるたびにクラスが変わる。
  #   クラスで指すと、変わった瞬間に「検査していないのに合格」になる。
  footerSelectors: ["footer", "[role=contentinfo]", ".footer", "#footer", ".l-footer", ".p-footer", ".site-footer"]
  # ヘッダーの代理店名を出す端末。
  #   実サイトのヘッダーは PC のみ表示 (class に hidden md:block があり、
  #   スマートフォン幅では CSS で隠される)。ここに sp を足せば
  #   スマートフォンでも「出ること」を期待する。
  headerDevices: [pc]
  anshinPack:
    - あんしんパック
    - 安心パック
  # 判定から除外する表記。
  #   「安心パックなし」は保険料の前提条件として注釈に出るもので、
  #   商品の案内ではない。これを「表示あり」と数えると、
  #   みらやく掲載不可の代理店が毎回 Critical になる (実サイトで発生)。
  #   除外したことは結果に併記するので、黙って無視はしない。
  anshinPackIgnore:
    - あんしんパックなし
    - 安心パックなし
    - あんしんパック無し
    - 安心パック無し

storage:
  # cookie | localStorage | both — サイトの実装に合わせる
  type: both
  # 保存キー (Cookie 名 / localStorage キー)
  key: agency_code

# 全代理店に共通する判定要素。値は既定で data-testid として解決される。
# "css=" / "text=" を先頭に付けると任意のセレクタも使用できる。
selectors:
  agencyName: agency-name
  agencyPhone: agency-phone
  agencyBanner: agency-banner
  agencyLogo: agency-logo
  fallbackNotice: fallback-notice
  ctaPrimary: cta-primary

# 申込フローに共通する設定
application:
  # 申込側で代理店を確認するための API (recognition の type: api で使用)
  sessionApiPattern: "**/api/session*"
  # 絶対に発生させてはならないリクエスト (申込完了・データ送信)。
  # 検知した場合は Critical として報告し、リクエスト自体を遮断する。
  # 判定はクエリ/フラグメントを除去し、末尾スラッシュの有無と大文字小文字を
  # 無視して行われるため、末尾に "*" を付ける必要はない。
  # "*" を付けると completed-guide.html のような無関係なページまで遮断してしまう。
  forbiddenRequestPatterns:
    - "**/entry/complete"
    - "**/api/application/submit"
  # 申込完了ボタン (押してはならない要素)
  forbiddenTestIds:
    - application-submit

# 代理店表示の「描画完了」をどう判定するか。
#   代理店情報はクライアント側で描画されることが多く、load 完了直後は
#   まだ反映されていない場合がある。実サイトの実装に合わせて設定する。
#
#   type: attribute — <html> の属性で判定する (モックサイトはこの方式)
#   type: selector  — 指定要素の出現で判定する (実サイトはこちらが現実的)
#   type: none      — 待たない (load 完了のみ)
#
#   実サイトへ向ける際に設定を合わせないと、判定条件が現れず
#   毎回 timeoutMs だけ待つことになる (テスト数 x 待機時間の無駄になる)。
#   条件が現れなかった場合はレポートに記録されるため、設定漏れに気づける。
readyIndicator:
  type: attribute
  attribute: data-agency-rendered
  value: '1'
  selector: null
  timeoutMs: 5000

# ページ遷移後のコード保持を検証する遷移パス (pages.yml の id)
persistenceFlow:
  - lp
  - product
  - price
