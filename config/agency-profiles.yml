# ============================================================
# 代理店の挙動パターン (プロファイル) 定義
#
#   このサイトの代理店は 214 件あるが、期待される挙動は
#   代理店ごとに固有ではなく、いくつかのパターンに分かれる。
#     ・みらやく掲載可否 (○ / ×) でセクションの表示・非表示が決まる
#     ・株式会社カカクコム・インシュアランスだけ専用 LP へリダイレクトする
#     ・littlefamily01 は自社コードで、代理店コードを無効化しオリジナル表示
#
#   そのため 214 件を個別に書くのではなく、
#     config/agency-master.tsv  … コードと属性 (どの代理店が何か)
#     config/agency-profiles.yml … パターンごとの期待結果 (このファイル)
#   の 2 つから config/agencies.yml を生成する。
#
#   `npm run agencies:build` で生成する。
#   既定では各パターンの代表を数件だけ出力する (scope.mode: sample)。
#   全 214 件を対象にする場合は `npm run agencies:build -- --all`。
#
#   [未実測] と書かれた項目は実サイトで確認できていない。
#   npm run discover の結果に合わせて設定する。
# ============================================================

# ---------- 出力対象の絞り込み ----------
scope:
  # sample = パターンごとに perProfile 件を実行ごとに抽選する
  # all    = 抽選せず全件を検査する (実行時間は長くなる)
  mode: sample
  # パターンごとの件数。
  #   毎回同じ代理店だけを検査すると残りに潜む問題を見逃し続けるため、
  #   実行ごとに抽選する。always に入れたコードはこの枠を消費するので、
  #   「必ず回る枠」を残すには always の件数より大きくしておく。
  #
  #   導入中は最小 (1) にしている。まず少ない件数で
  #   「ツールが正しく動くか」を確定させ、そのあとで増やす。
  #   実行ごとに変える場合は設定を書き換えず環境変数を使う:
  #     QA_AGENCY_PER_PROFILE=3   (ブラウザ画面の「件数」で切り替えられる)
  perProfile: 1
  # 抽選に関わらず必ず含めるコード。
  #   挙動が 1 件しかなく、外すと検査されなくなるものだけを入れる。
  always:
    - littlefamily01  # 自社コード (オリジナル表示)
    - littlefamily03  # カカクコム 本体 (専用LPへリダイレクトの代表)
  # 検査対象から除外する mirayaku の値
  #   エラー / 要確認 / 空欄 は期待結果が確定していないため除外する
  excludeMirayaku:
    - エラー
    - 要確認
    - ""

# ---------- 表示の一貫性検査 ----------
#   みらやくの表示・非表示は 1 つのセクションだけでなく、
#   フッターの表記や各所の注釈にも及ぶ。どこが変わるかを
#   列挙しきれないため、次の性質を使って検査する。
#
#     ・同じパターンの代理店同士は表示が一致するはず
#       → 一致しなければ、その代理店だけ扱いが違う (Critical)
#     ・下記の組み合わせは表示が異なるはず
#       → 同じなら切り替えが効いていない (Critical)
#
#   この検査は「どこが変わるか」を知らなくても成立する。
displayMustDiffer:
  - [mirayaku-visible, mirayaku-hidden]

#   比較から除外する鍵。
#   実行ごとに出入りする要素 (ABテストの差し込み枠、ランダム表示の
#   キャンペーン枠など) を入れる。data-testid / css= セレクタで書く。
#   `*` を使ったパターンも書ける (月ごとに id が変わる要素のため)。
displayIgnoreKeys:
  # 公開前のキャンペーンバナー枠。
  #   実際の画面には表示されていない (運用側の確認済み)。
  #   id に年月が入るため、毎月書き換えずに済むようパターンで除外する。
  - "css=#lf-campaign-banner-*"

#   コードなしの表示と一致するはずのパターン。
#   「コードを付けても何も変わらない」ことが仕様の分類があれば、
#   ここに書くと差分が出たときに報告される (Medium)。
#   支店コードは親コードと同じ挙動になるのが仕様のため、ここには入れない。
sameAsNoCodeProfiles: []

# ---------- 割り当てルール (上から順に最初に一致したものを採用) ----------
assign:
  # A0010 (Amazon) は検査対象外。
  # 運用側の確認により、通常 LP のままで代理店としての切り替えを行わない。
  - match: { code: A0010 }
    exclude: true
    reason: Amazon 用のため検査対象外 (通常 LP のまま)
  # 支店コード (末尾 brNN) は親コードと同じ挙動になるのが仕様。
  #   マスタの各行が親と同じ みらやく可否を持っているため、
  #   専用の割り当てルールは不要 (下の みらやく / カカクコムのルールで決まる)。
  #
  #   2026-08 現在、支店コードが親コードとして扱われない不具合がある。
  #   これは config/known-issues.yml で「既知の不具合」として扱う
  #   (期待結果は仕様どおりのままにし、修正日を過ぎたら通常の不具合として報告する)。
  - match: { code: littlefamily01 }
    profile: direct
  - match: { codePrefix: littlefamily03 }
    profile: kakakucom
  - match: { mirayaku: "○" }
    profile: mirayaku-visible
  - match: { mirayaku: "×" }
    profile: mirayaku-hidden

# ---------- パターンごとの期待結果 ----------
profiles:
  # 自社コード。代理店コードを無効化しオリジナルを表示する
  direct:
    label: 自社コード (オリジナル表示)
    entryPath: /lp/service/
    expectedFinalPath: /lp/service/
    redirected: false
    redirectMechanism: none
    expectedRedirectCount: 0
    expectedRedirectPaths: []
    # [未実測] 表示・非表示セクションの data-testid が未確認
    visibleSections: []
    hiddenSections: []
    expectedTexts: {}
    expectedAssets: {}
    cta: null
    application: null

  # 株式会社カカクコム・インシュアランス (価格コム限定プラン)
  #
  #   流入は最初から専用 LP。
  #     https://.../lp/service-premium/?insAgentNo=littlefamily03
  #   通常 LP にコード付きで入ってくる URL は運用上存在しない。
  #
  #   リダイレクトが起きるのは「再訪」のとき。
  #   コードが保存された状態 (Cookie) で通常 LP を開くと専用 LP へ飛ぶ。
  #   そのため流入時 (redirected) と再訪時 (revisitRedirect) を分けて設定する。
  kakakucom:
    label: カカクコム (専用LPが入口・再訪時にリダイレクト)
    entryPath: /lp/service-premium/
    expectedFinalPath: /lp/service-premium/
    # 流入時はリダイレクトしない (最初から専用 LP に入る)
    redirected: false
    redirectMechanism: none
    expectedRedirectCount: 0
    expectedRedirectPaths: []
    # 再訪時: コードが保存された状態で通常 LP を開くと専用 LP へ飛ぶ
    revisitRedirect:
      fromPath: /lp/service/
      toPath: /lp/service-premium/
    visibleSections: []
    hiddenSections: []
    expectedTexts: {}
    expectedAssets: {}
    cta: null
    application: null

  # みらやく掲載可 (○) — みらやくのセクションが表示される
  mirayaku-visible:
    label: みらやく掲載可
    entryPath: /lp/service/
    expectedFinalPath: /lp/service/
    redirected: false
    redirectMechanism: none
    expectedRedirectCount: 0
    expectedRedirectPaths: []
    # [未実測] みらやくセクションの data-testid が未確認。
    # 判明したら visibleSections に入れる (例: mirayaku-section)。
    visibleSections: []
    hiddenSections: []
    expectedTexts: {}
    expectedAssets: {}
    cta: null
    application: null


  # みらやく掲載不可 (×) — みらやくのセクションが表示されない
  mirayaku-hidden:
    label: みらやく掲載不可
    entryPath: /lp/service/
    expectedFinalPath: /lp/service/
    redirected: false
    redirectMechanism: none
    expectedRedirectCount: 0
    expectedRedirectPaths: []
    visibleSections: []
    # [未実測] 判明したら hiddenSections に入れる (例: mirayaku-section)。
    # ここが設定されるまで「×なのに表示されている」は検知できない。
    hiddenSections: []
    expectedTexts: {}
    expectedAssets: {}
    cta: null
    application: null

# ---------- 無効コード / コードなしの期待結果 ----------
invalidCodes:
  - code: NOSUCHCODE
    label: 未登録コード
  - code: LITTLEFAMILY01
    label: 大文字 (別コードとして扱われるべき)
  - code: littlefamily001
    label: 桁数違い

invalidExpectation:
  expectedFinalPath: /lp/service/
  redirected: false
  # [未実測] 無効コード時に通常表示へフォールバックすることを
  # 何で確認するか (代理店セクションが出ないこと等)
  visibleSections: []
  hiddenSections: []
  application: null

noCodeExpectation:
  expectedFinalPath: /lp/service/
  redirected: false
  visibleSections: []
  hiddenSections: []
  application: null

# ---------- リダイレクト・セキュリティの共通設定 ----------
redirect:
  maxRedirects: 5
  allowedQueryParams:
    - insAgentNo
  forbiddenQueryParamKeywords:
    - mail
    - tel
    - name
    - password
    - token
  piiValuePatterns:
    - "[\\w.+-]+@[\\w-]+\\.[\\w.]+"
    - "0\\d{1,4}-?\\d{1,4}-?\\d{3,4}"

security:
  redirectParamNames:
    - redirect
    - redirect_to
    - return_to
    - next
    - url
  externalProbeUrl: https://example.com/
  allowedRedirectOrigins: []
  xssPayloads:
    - "\"><script>window.__qaInjection=1</script>"
    - "'><img src=x onerror=window.__qaInjection=1>"
  maskParamNames:
    - token
    - handoff_token
    - session
    - sid
  maskValuePatterns:
    - "eyJ[A-Za-z0-9_-]{10,}"
    - "[0-9a-f]{32,}"
