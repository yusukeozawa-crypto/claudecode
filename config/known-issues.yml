# ============================================================
# 既知の不具合
#
#   すでに把握していて、修正リリースが決まっている不具合を登録する。
#   ここに登録した不具合は **Low に落として報告** するため、
#   毎回の検査で Critical が並んで本当の異常が埋もれることがない。
#
#   期待結果 (config/agencies.yml) は **仕様どおりのまま**にしておく。
#     現状に合わせて期待結果を書き換えると、修正されたことも
#     壊れ直したことも分からなくなるため。
#
#   fixedOn を過ぎたら既知扱いをやめ、通常の重大度で報告する。
#     → 修正リリース後に直っていなければ、その日から Critical で出る。
#     → 直っていれば何も出ない。
#
#   検査を実行すると、有効な既知不具合の一覧がレポートに出る。
# ============================================================

knownIssues:
  # ----------------------------------------------------------
  # 支店コード (末尾 brNN) が親コードとして扱われない
  #   LIST_ID 301〜350   : カカクコム    → 専用 LP へリダイレクトされない
  #   LIST_ID 3301〜3350 : Sasuke (対面) → みらやく × なのに安心パックが表示される
  #   LIST_ID 5701〜5720 : ジャパンペット → みらやく × なのに安心パックが表示される
  # ----------------------------------------------------------
  - id: branch-code-not-applied
    title: 支店コードが親コードとして扱われない
    note: >-
      LIST_ID 301〜350 / 3301〜3350 / 5701〜5720 で確認。
      支店コード全体が同じ状態のため br 付き全件を対象にしている。
      2026-09-03 のリリースで修正予定。
    # 修正リリース日。この日以降は既知扱いをやめる (通常の重大度で報告する)
    fixedOn: 2026-09-03
    # 対象の代理店コード (`*` が使える)
    # 支店コード (末尾 brNN) 全体を対象にする。
    # 一部だけ登録すると、登録漏れのコードが毎回 Critical で並び、
    # 本当の異常が埋もれる (littlefamily18br07 で実際に起きた)。
    codes:
      - "littlefamily*br*"
    # 対象の検知種別。ここに無い種別は既知扱いしない
    # (同じ代理店の別の不具合を見逃さないため)
    categories:
      - agency-display
      - agency-redirect
      - agency-persistence
      - agency-handoff
