# ============================================================
# 実行時の負荷・タイムアウト設定
#   外部サイトへ過剰なリクエストを送らないための調整はここで行う
# ============================================================
# 並列実行数 (CI では workersCi を使用)
workers: 4
workersCi: 2

# リトライ回数
retries: 0
retriesCi: 1

# タイムアウト (ms)
timeouts:
  test: 90000
  navigation: 30000
  action: 15000
  expect: 10000

# リクエスト間隔 (ms) — ページ遷移・リンク検査の前に待機する
throttle:
  navigationDelayMs: 250
  linkCheckDelayMs: 150
  # リンク検査の同時実行数
  linkCheckConcurrency: 4

# Playwright のトレース取得。
#   トレースには通信内容 (一時トークン・Cookie・リクエストボディ) がそのまま
#   含まれるため、Artifact の共有範囲に注意すること。
#   秘密情報を一切残したくない場合は 'off' にする (デバッグ容易性とのトレードオフ)。
#   off | on | retain-on-failure | on-first-retry
trace: on-first-retry
traceCi: retain-on-failure

# 重大度ゲート: ここに含まれる重大度が 1 件でもあればテストを失敗させる
failOnSeverities:
  - critical
  - high
