# ============================================================
# 備考 (保留事項 / 後日確認 / 後日仕様変更)
#
#   「今は判断できないこと」「あとで確認すること」「先の仕様変更」を
#   ここに書くと、ブラウザ画面の「備考」に出る。
#   検査結果とは別に、忘れないための覚え書き。
#
#   自動で拾えるものは書かない (書き写すと必ず古くなる)。
#   次は設定から自動で備考に出る:
#     ・既知の不具合 (config/known-issues.yml) と その修正予定日
#     ・検査対象外にした代理店 (config/agencies.yml の excludedAgencies)
#     ・未実測の項目 (保存先 / 遷移方式 / リダイレクト回数)
#
#   kind:
#     保留       … 判断待ち。決まるまで検査できない
#     確認待ち   … 誰かに聞く / 実物を見れば分かる
#     仕様変更   … 先の日付で仕様が変わる。その日以降に再確認する
#
#   due: あれば「いつ以降に確認するか」。過ぎたものは画面で強調される。
# ============================================================

notes:
  - id: staging-checklist-not-verified
    kind: 確認待ち
    title: チェックリストを実サイトで 1 回も確認していない
    detail: >-
      モックサイトでしか動作確認していない。ステージングを 1 回まわして
      ✅ / ❌ / — が想定どおりか見る。特に (1) カカクコムの「リダイレクト」が
      ❌ にならないか (2) 想定と違う列が — になっていないか
      (— は「対象外」だが、設定漏れで検査が回っていない場合も — になる)。

  - id: kakakucom-redirect-condition
    kind: 確認待ち
    title: カカクコムのリダイレクト条件 (URL のコードか Cookie か)
    detail: >-
      「通常 LP にカカクコムのコードを持ったユーザーが来たら専用 LP へ」の
      「持った」が URL のコードなのか保存済み Cookie なのかが未確定。
      流入 (まっさら) と再訪 (保存後) の 2 本に分けて検査しているので、
      どちらの条件で起きるかはレポートで読める。実測で確定させる。

  - id: anshin-pack-on-premium-lp
    kind: 確認待ち
    title: 専用 LP (カカクコム) の「あんしんパック」の扱い
    detail: >-
      専用 LP に あんしんパック の記載があるべきかが未確定のため、
      いまは検査していない (チェックリストでは — になる)。
      決まったら config/agency-profiles.yml の kakakucom.anshinPack を
      present / absent に変える。

  - id: littlefamily55-anshin-pack
    kind: 不具合
    title: littlefamily55 (クロス動物病院用) でみらやく掲載不可なのに「安心パック」が出る
    detail: >-
      2026-08-23 の本番検査で検知。運用側の確認でサイト側の不具合と判断。
      注釈の「安心パックなし」は判定から除外した上で、それとは別に
      「安心パック」の記載が残っている。
      抽選に当たらない回に見落とさないよう、
      config/agency-profiles.yml の scope.always に入れて毎回検査している。
      再現: /lp/service/?insAgentNo=littlefamily55

  - id: littlefamily42-agency-name-missing
    kind: 確認待ち
    title: littlefamily42 (Sasuke（募集人8）) でヘッダー・フッターに代理店名が出ない
    detail: >-
      2026-08-22 のステージング検査で検知。br なしの稼働中コードで、
      支店コードの既知不具合 (2026-09-03 修正予定) とは別件。
      運用側の確認では稼働中のコードとのこと。
      募集人系のコード (littlefamily33〜43、Sasuke（募集人1〜10）) で
      同じことが起きていないか、件数を増やして確認する。
      再現: /lp/service/?insAgentNo=littlefamily42

  - id: agency-master-company-names
    kind: 保留
    title: マスタの会社名が社内の管理名になっている行がある
    detail: >-
      config/agency-master.tsv の company が実際のサイト表示と違う行がある
      (例 littlefamily42「Sasuke（募集人8）」→ 実際は
      「Sasuke Financial Lab株式会社」、littlefamily54「病院貼り付け窓口バナー用」)。
      サイト側が正しい。検査で名前が一致しないときは実際の表示名を
      レポートに出すようにしたので、全件 (QA_AGENCY_SCOPE=all) で 1 回まわせば
      「管理名 → 実際の表示名」の対応表が集まる。それをマスタに反映する。
      反映するまでは該当社が Critical で出続ける (運用側の判断で Critical のまま)。
