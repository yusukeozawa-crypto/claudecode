# ============================================================
# エラー検知の設定 (計測タグ・外部ドメインは除外できる)
# ============================================================
console:
  enabled: true
  # console.error / console.warn のどちらを収集するか
  levels: [error]
  # メッセージ本文の除外パターン (部分一致 / 正規表現は /.../ で囲む)
  ignoreMessages:
    - "favicon.ico"
    - "/ResizeObserver loop/"

pageError:
  enabled: true
  ignoreMessages: []

# このツール自身の安全装置による遮断。
#   本番は読み取り専用のため、GET 以外のリクエスト (計測タグの送信など) を
#   実行前に止めている。ブラウザはそれを「読み込み失敗」としてコンソールに出すが、
#   **検査対象サイトの不具合ではない**。
#   1 件ずつ報告すると数千件になり、本当の不具合が埋もれるため、
#   まとめて 1 件の Low として記録する。
selfBlockedPatterns:
  - "ERR_BLOCKED_BY_CLIENT"

# 他社タグ (計測・解析・広告) のスクリプト内部で起きたエラーの重大度。
#   自社サイトのコードではないため、Critical / High では報告しない。
#   無視もしない (表示を壊すことがあるため記録する)。
#   自社ドメインのスクリプトのエラーは従来どおり High。
thirdPartyScriptSeverity: low

# 同じ内容のエラーをまとめる上限。
#   同一メッセージが何千件も出るサイトがあるため、
#   種類ごとに件数を数えて 1 件として扱う (実行時間とレポートの可読性のため)。
maxDistinctMessages: 50

# 実行環境側の一時的な通信断。
#   Wi-Fi の切り替えや回線の瞬断で発生する。検査対象サイトの不具合ではないため
#   Low として記録する (完全に無視はしない。頻発するなら実行環境の問題)。
transientNetworkPatterns:
  - "ERR_NETWORK_CHANGED"
  - "ERR_INTERNET_DISCONNECTED"
  - "ERR_NETWORK_IO_SUSPENDED"
  - "ERR_NETWORK_ACCESS_DENIED"

network:
  enabled: true
  # 不具合とみなす HTTP ステータス
  failStatuses: [400, 401, 403, 404, 405, 408, 409, 410, 429, 500, 501, 502, 503, 504]
  # 除外する URL パターン (計測タグ・広告・外部ドメイン)
  ignoreUrlPatterns:
    - "**/*.google-analytics.com/**"
    - "**/*.googletagmanager.com/**"
    - "**/*.doubleclick.net/**"
    - "**/*.facebook.com/**"
    - "**/*.hotjar.com/**"
    - "**/*.clarity.ms/**"
    - "**/*.yahoo.co.jp/**"
  # 自ドメイン以外のリクエスト失敗を無視するか
  ignoreThirdParty: true
  # 画面遷移によって中断されたリクエスト (net::ERR_ABORTED) を無視するか。
  # リダイレクトを伴うページでは、遷移時に読み込み中のリクエストが必ず中断されるため
  # 既定で無視する (サーバー側の異常ではない)。
  ignoreAbortedRequests: true

links:
  enabled: true
  # 検査するリンクの範囲: internal | all
  scope: internal
  # 外部リンクは HEAD リクエストのみで検査する (scope: all の場合)
  externalMethod: HEAD
  ignoreUrlPatterns:
    - "mailto:*"
    - "tel:*"
    - "javascript:*"
    - "**/*.pdf"
  # 1 ページあたりの検査リンク上限 (過剰リクエスト防止)
  maxLinksPerPage: 40
  # リダイレクトループ検知の上限
  maxRedirects: 5

timeout:
  # ページ読み込みがこの時間(ms)を超えたら「タイムアウト」として記録する
  pageLoadWarnMs: 15000
