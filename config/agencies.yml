redirect:
  maxRedirects: 5
  allowedQueryParams:
    - insAgentNo
  forbiddenQueryParamKeywords:
    - mail
    - tel
    - name
    - password
    - token
  piiValuePatterns:
    - "[\\w.+-]+@[\\w-]+\\.[\\w.]+"
    - 0\d{1,4}-?\d{1,4}-?\d{3,4}
security:
  redirectParamNames:
    - redirect
    - redirect_to
    - return_to
    - next
    - url
  externalProbeUrl: https://example.com/
  allowedRedirectOrigins: []
  xssPayloads:
    - '"><script>window.__qaInjection=1</script>'
    - "'><img src=x onerror=window.__qaInjection=1>"
  maskParamNames:
    - token
    - handoff_token
    - session
    - sid
  maskValuePatterns:
    - eyJ[A-Za-z0-9_-]{10,}
    - "[0-9a-f]{32,}"
