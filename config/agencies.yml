# ============================================================
# 【自動生成ファイル】直接編集しないこと
#
#   生成元:
#     config/agency-master.tsv    (代理店コードと属性)
#     config/agency-profiles.yml  (挙動パターンごとの期待結果)
#
#   再生成: npm run agencies:build
#
#   全 59 件 / マスタ 214 件
#
#   実際に検査する代理店は実行ごとに抽選される (scope を参照)。
#   毎回同じ代理店だけを検査すると、残りに潜む問題を見逃し続けるため。
#   全件を検査する場合: npm run test:agency:all
#   抽選を再現する場合: QA_AGENCY_SEED=<レポートに記録された値>
# ============================================================
scope:
  mode: sample
  perProfile: 1
  always:
    - littlefamily01
    - littlefamily03
    - littlefamily55
patternOrder:
  - ダイレクト
  - ダイレクト (みらやく×)
  - カカクコム
  - みらやく○
  - みらやく×
  - カカクコム (br)
  - みらやく○ (br)
  - みらやく× (br)
displayMustDiffer:
  - - mirayaku-visible
    - mirayaku-hidden
displayIgnoreKeys:
  - css=#lf-campaign-banner-*
sameAsNoCodeProfiles: []
