<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検出テスト用｜リダイレクト後に再読み込みするページ</title>
</head>
<body>
  <h1 data-testid="redirect-then-reload">リダイレクトします</h1>
  <p>本番サイトと同じく、JavaScript で遷移したあとに遷移先が 1 回だけ再読み込みされます。</p>
  <p>再読み込みをリダイレクト回数に数えないことを検査するためのページです。</p>
  <script>
    // JavaScript による遷移 (HTTP 3xx でも meta refresh でもない)
    location.replace('/broken/reloads-once.html');
  </script>
</body>
</html>
