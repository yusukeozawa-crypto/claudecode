<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検出テスト用｜遅れて表示される要素</title>
</head>
<body>
  <section data-testid="always-visible" style="height:200px;">常に表示されているセクション</section>

  <!-- 遅延読み込みのバナー: load 完了後に高さが付く (キャンペーン枠の再現) -->
  <div id="late-banner" style="width:100%;height:0;overflow:hidden;">
    <section data-testid="late-banner-inner" style="height:292px;">遅れて表示されるバナー</section>
  </div>

  <!-- 表示され続ける / 消えるを繰り返す要素 (アニメーションの再現) -->
  <section data-testid="blinking" style="height:100px;">点滅する要素</section>

  <script>
    // load から 1.2 秒後にバナーが開く
    window.addEventListener('load', () => {
      setTimeout(() => { document.getElementById('late-banner').style.height = '292px'; }, 1200);
    });
    // 1 秒ごとに表示・非表示が切り替わる
    setInterval(() => {
      const element = document.querySelector('[data-testid="blinking"]');
      element.style.display = element.style.display === 'none' ? '' : 'none';
    }, 1000);
  </script>
</body>
</html>
