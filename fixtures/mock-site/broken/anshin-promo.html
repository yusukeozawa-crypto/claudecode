<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安心パックの訴求が混ざったページ (再現用)</title>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <!--
    安心パック (= みらいの約束) の文脈判定の再現ページ。

    安心パックは損害保険の資格が必要な商品で、少額短期保険の資格しか
    持たない代理店 (みらやく掲載不可) に訴求させると法令違反になる。
    「文字があるか」ではなく「どういう文脈で出ているか」で判定する必要がある。

    このページには許してよい注釈と、許してはいけない訴求を並べてある。
    判定を変えたときに、どちらも取り違えないことを確かめる。
  -->
  <main class="container">
    <h1>再現用ページ</h1>

    <!-- 許してよいもの: 注釈 (※ 付き・本文より小さい文字) -->
    <p class="meta">※2 猫・0〜20歳・70％補償・安心パックなし・免責金額なし・月払の保険料の推移です。</p>

    <!--
      許してよいもの: 目印と本文が別の要素に分かれた注釈 (実サイトと同じ形)。
      「安心パック」がある span 自身には ※ が無い。
      要素自身だけを見ると注釈と分からず、正しい注釈を違反にしてしまう。
    -->
    <p class="meta"><span>※5</span><span>「安心パック」は、所定の特約を付帯し、同時に総合保障保険『みらいの約束』へご加入いただくものです。</span></p>

    <!-- 許してはいけないもの: 訴求 (※ が無い) -->
    <p data-testid="promo-plain">総合保障保険『みらいの約束』もあわせてご検討ください。</p>

    <!-- 許してはいけないもの: 見出し (※ が付いていても訴求) -->
    <h2 data-testid="promo-heading">『安心パック※9』でさらに安心！</h2>

    <!-- 許してはいけないもの: 本文より大きい文字 (※ が付いていても訴求) -->
    <p data-testid="promo-large" style="font-size: 24px;">『みらいの約束※1』でさらに安心！</p>

    <!--
      判定できないもの (記録として残す):
        キーワードを含まない訴求文。実サイトの
        「月額＋180円※1〜でさらに安心！」がこれに当たる。
        語で探す方式では拾えない。拾いたい場合は
        config/agency.yml の anshinPack に文言を足す必要がある。
    -->
    <p data-testid="promo-no-keyword" style="font-size: 24px;">月額＋180円※1〜でさらに安心！</p>
  </main>
</body>
</html>
