<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検出テスト用｜画像読み込みエラーページ</title>
</head>
<body>
  <h1 data-testid="broken-title">画像が読み込めないページ</h1>
  <img src="/assets/hero.svg" width="400" height="129" alt="正常な画像">
  <img src="/assets/does-not-exist.png" width="200" height="100" alt="存在しない画像" data-testid="missing-image">
  <p>このページは検出ロジックの自己検査 (self-check) 専用です。</p>
</body>
</html>
