name: 公開後QA

# 実行タイミング
#   1. 手動実行 (対象環境・端末を選択できる)
#   2. main ブランチへのデプロイ後
#   3. 毎日定時 (JST 09:00)
#   4. Pull Request (self-test ジョブのみ)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象環境
        required: true
        default: staging
        type: choice
        options: [staging, production]
      suite:
        description: 実行するテスト
        required: true
        default: all
        type: choice
        options: [all, agency, redirect, handoff, security, visual, crawl, health, text]
      device:
        description: 対象端末 (all / pc / sp)
        required: true
        default: all
        type: choice
        options: [all, pc, sp]

  push:
    branches: [main]
    # デプロイ対象の変更時のみ実行したい場合は paths を調整する
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches: [main]

  # デプロイ用ワークフローの完了後に実行する場合はこちらを有効にする
  # workflow_run:
  #   workflows: ["Deploy"]
  #   types: [completed]
  #   branches: [main]

  schedule:
    # UTC 00:00 = JST 09:00
    - cron: '0 0 * * *'

# 同一ブランチの実行が重なった場合は古い実行をキャンセルする
concurrency:
  group: qa-${{ github.ref }}-${{ github.event.inputs.environment || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # self-test: 同梱モックサイトに対して QA ツール自体を検証する。
  #   Secrets を必要としないため、URL 未設定の状態でもパイプラインを確認できる。
  #   QA ツールの改修時のリグレッション検知も兼ねる。
  # ============================================================
  self-test:
    name: QAツールの自己検証 (モックサイト)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      QA_ENV: local

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Chromium をインストール
        run: npx playwright install --with-deps chromium

      - name: 型チェック
        run: npm run typecheck

      - name: 全テストを実行 (モックサイト)
        id: qa
        continue-on-error: true
        # モックサイト (LP ドメイン + 申込ドメイン) は playwright.config.ts が自動起動する
        run: npx playwright test

      - name: レポートを Artifact として保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-report-${{ github.run_number }}
          path: |
            reports/qa-report.html
            reports/qa-report.json
            reports/playwright-report/
            screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: 重大度ゲート (Critical / High があれば失敗)
        # 基準画像は環境ごとに分離されており、CI とローカルでフォント描画が異なると
        # 画像差分 (Low) が出ることがある。Low はゲート対象外。
        run: npm run gate

      - name: 検査そのものが失敗した場合はジョブを失敗させる
        if: steps.qa.outcome == 'failure'
        run: |
          echo "QA ツールの自己検証が失敗しました (reports/qa-report.html を確認してください)"
          exit 1

  # ============================================================
  # qa: 実サイト (ステージング / 本番) に対する公開後QA。
  #   URL・認証情報は GitHub Secrets から取得する。
  #   Pull Request では実行しない (Secrets を使うため)。
  # ============================================================
  qa:
    name: 公開後QA (${{ github.event.inputs.environment || 'staging' }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 対象環境: 手動実行では入力値、それ以外は staging を既定にする
      QA_ENV: ${{ github.event.inputs.environment || 'staging' }}
      # 検査対象 URL・認証情報は GitHub Secrets から取得する (ログには出力しない)
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      # 申込ドメイン (LP とは別ドメイン)
      STAGING_APPLICATION_BASE_URL: ${{ secrets.STAGING_APPLICATION_BASE_URL }}
      PRODUCTION_APPLICATION_BASE_URL: ${{ secrets.PRODUCTION_APPLICATION_BASE_URL }}
      STAGING_BASIC_USER: ${{ secrets.STAGING_BASIC_USER }}
      STAGING_BASIC_PASS: ${{ secrets.STAGING_BASIC_PASS }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 必要な Secrets の設定を確認
        # URL が未設定のまま実行すると分かりにくいエラーになるため、先に明示的に止める
        run: |
          if [ "$QA_ENV" = "production" ]; then
            LP_URL="$PRODUCTION_BASE_URL"; APP_URL="$PRODUCTION_APPLICATION_BASE_URL"
            LP_NAME="PRODUCTION_BASE_URL"; APP_NAME="PRODUCTION_APPLICATION_BASE_URL"
          else
            LP_URL="$STAGING_BASE_URL"; APP_URL="$STAGING_APPLICATION_BASE_URL"
            LP_NAME="STAGING_BASE_URL"; APP_NAME="STAGING_APPLICATION_BASE_URL"
          fi
          MISSING=""
          [ -z "$LP_URL" ] && MISSING="$MISSING $LP_NAME"
          [ -z "$APP_URL" ] && MISSING="$MISSING $APP_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error::GitHub Secrets が未設定です:$MISSING"
            echo "リポジトリの Settings > Secrets and variables > Actions で設定してください。"
            echo "LP ドメインと申込ドメインの両方が必要です (docs/operations.md 参照)。"
            exit 1
          fi
          echo "対象環境 $QA_ENV の URL 設定を確認しました (値は出力しません)"

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Chromium をインストール
        # Firefox / WebKit を config/devices.yml で有効化した場合は
        # 下記を `npx playwright install --with-deps` に変更する
        run: npx playwright install --with-deps chromium

      - name: 型チェック
        run: npm run typecheck

      - name: テスト実行
        id: qa
        # 失敗しても後続のレポート収集を行うため、ここでは終了コードを無視する
        continue-on-error: true
        run: |
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          DEVICE="${{ github.event.inputs.device || 'all' }}"
          ARGS=""
          if [ "$SUITE" != "all" ]; then ARGS="$ARGS --grep @$SUITE"; fi
          if [ "$DEVICE" != "all" ]; then ARGS="$ARGS --project=*-$DEVICE"; fi
          echo "実行: npx playwright test $ARGS (QA_ENV=$QA_ENV)"
          npx playwright test $ARGS

      - name: HTML レポートを Artifact として保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_number }}
          path: |
            reports/qa-report.html
            reports/qa-report.json
            reports/playwright-report/
            reports/text/
          retention-days: 30
          if-no-files-found: warn

      - name: スクリーンショットを Artifact として保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 差分画像 (reports/test-results) と現在画像・基準画像をまとめて保存する
          name: qa-screenshots-${{ github.run_number }}
          path: |
            screenshots/
            reports/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: 重大度ゲート (Critical / High があれば失敗)
        run: npm run gate

      - name: 検査そのものが失敗した場合はジョブを失敗させる
        # Critical / High が無くても、テスト実行自体が失敗していれば失敗として扱う
        if: steps.qa.outcome == 'failure'
        run: |
          echo "テスト実行が失敗しました (reports/qa-report.html を確認してください)"
          exit 1
